name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Build release
        run: |
          # Universal binary: Apple silicon + Intel.
          swift build -c release --arch arm64 --arch x86_64
          BIN_PATH=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          lipo "$BIN_PATH/Thoth" -verify_arch arm64 x86_64

          APP_NAME="Thoth"
          APP_BUNDLE="$APP_NAME.app"
          ICON_SRC="icon/icon_1024.png"

          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp "$BIN_PATH/$APP_NAME" "$APP_BUNDLE/Contents/MacOS/"

          if [ -f "$ICON_SRC" ]; then
              echo "Building AppIcon.icns from $ICON_SRC..."
              ICONSET=$(mktemp -d)/AppIcon.iconset
              mkdir -p "$ICONSET"
              sips -z 16   16   "$ICON_SRC" --out "$ICONSET/icon_16x16.png"      >/dev/null
              sips -z 32   32   "$ICON_SRC" --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
              sips -z 32   32   "$ICON_SRC" --out "$ICONSET/icon_32x32.png"      >/dev/null
              sips -z 64   64   "$ICON_SRC" --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
              sips -z 128  128  "$ICON_SRC" --out "$ICONSET/icon_128x128.png"    >/dev/null
              sips -z 256  256  "$ICON_SRC" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
              sips -z 256  256  "$ICON_SRC" --out "$ICONSET/icon_256x256.png"    >/dev/null
              sips -z 512  512  "$ICON_SRC" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
              sips -z 512  512  "$ICON_SRC" --out "$ICONSET/icon_512x512.png"    >/dev/null
              sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
              iconutil -c icns "$ICONSET" -o "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
              rm -rf "$(dirname "$ICONSET")"
              ICON_KEY="<key>CFBundleIconFile</key><string>AppIcon</string>"
          else
              echo "No icon source at $ICON_SRC; bundle will have no icon."
              ICON_KEY=""
          fi

          # Extract version from tag; it must match the VERSION file used by scripts/build.sh
          VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))" >&2
              exit 1
          fi

          cat > "$APP_BUNDLE/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.carloscosta.thoth</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              $ICON_KEY
          </dict>
          </plist>
          PLIST

          ditto -c -k --keepParent "$APP_BUNDLE" "$APP_NAME-$VERSION-mac.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Thoth-*-mac.zip
          generate_release_notes: true
